<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — FolioOne</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="marketing">
  <header class="nav shell"><a class="brand" href="/"><span>F</span> FolioOne</a></header>
  <main class="auth-section shell single-auth">
    <div class="auth-copy">
      <div class="eyebrow">ACCOUNT SECURITY</div>
      <h2>Choose a new password.</h2>
      <p>Use at least 10 characters. Resetting your password signs out older sessions.</p>
    </div>
    <div class="auth-card">
      <form id="resetPasswordForm" class="auth-form">
        <label>New password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <label>Confirm password<input name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="btn dark full" type="submit">Reset password →</button>
        <p class="form-message" id="resetMessage"></p>
      </form>
    </div>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
