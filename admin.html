<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;background:radial-gradient(circle at top,#3a070b,#050505 45%)}main{max-width:520px;margin:auto;padding:32px 18px}.brand{letter-spacing:.25em;color:#d81f2a;font-size:12px;font-weight:800}h1{font-family:Georgia,serif;font-size:38px;margin:8px 0}.card{background:#0d0d0e;border:1px solid #351014;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 18px 50px #0008}input,button{width:100%;padding:14px;border-radius:13px;font:inherit}input{background:#070707;border:1px solid #3b2022;color:white;margin:8px 0}button{border:0;background:#c71924;color:#fff;font-weight:800;margin-top:8px;cursor:pointer}.muted{color:#a98e90;font-size:13px;line-height:1.5}.hidden{display:none}.preview{width:100%;height:230px;object-fit:cover;border-radius:16px;background:#151515;margin:8px 0}.ok{color:#70d78b;font-size:13px;margin-top:8px}.err{color:#ff747c;font-size:13px;margin-top:8px}</style></head><body><main><div class="brand">TAHA × SHAIMAA</div><h1>Date Admin ❤️</h1><p class="muted">Upload or replace the two photos used by the date website.</p><section class="card" id="login"><b>Admin login</b><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Unlock Admin</button><div id="loginMsg"></div></section><div id="panel" class="hidden"><section class="card"><b>❤️ Taha & Shaimaa — Hero photo</b><p class="muted">Main photo shown at the top of the website.</p><img id="heroPrev" class="preview"><input id="hero" type="file" accept="image/*"><button onclick="send('hero')">Upload / Replace Hero</button><div id="heroMsg"></div></section><section class="card"><b>👶🏻 Amoura photo</b><p class="muted">Photo shown inside “نشوف عمورة”.</p><img id="amouraPrev" class="preview"><input id="amoura" type="file" accept="image/*"><button onclick="send('amoura')">Upload / Replace Amoura</button><div id="amouraMsg"></div></section></div></main><script>let token=sessionStorage.getItem('dateAdminToken')||'';async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});const d=await r.json();if(!r.ok){loginMsg.className='err';loginMsg.textContent='Wrong password';return}token=d.token;sessionStorage.setItem('dateAdminToken',token);show()}function show(){login.classList.add('hidden');panel.classList.remove('hidden');load()}async function load(){const d=await fetch('/api/images').then(r=>r.json());heroPrev.src=d.hero||'';amouraPrev.src=d.amoura||''}async function send(slot){const file=document.getElementById(slot).files[0],msg=document.getElementById(slot+'Msg');if(!file){msg.className='err';msg.textContent='Choose a photo first';return}msg.className='muted';msg.textContent='Uploading…';const f=new FormData();f.append('image',file);const r=await fetch('/api/admin/upload/'+slot,{method:'POST',headers:{Authorization:'Bearer '+token},body:f});const d=await r.json();if(!r.ok){msg.className='err';msg.textContent=d.error||'Upload failed';return}msg.className='ok';msg.textContent='Saved successfully ✓';document.getElementById(slot+'Prev').src=d.url+'?v='+Date.now()}if(token)show();</script></body></html>
