<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Date Admin</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3a070b,#050505 45%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:520px;margin:auto;padding:32px 18px}.brand{letter-spacing:.25em;color:#e32834;font-size:12px;font-weight:800}h1{font-family:Georgia,serif;font-size:38px;margin:8px 0}.card{background:#0d0d0e;border:1px solid #351014;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 18px 50px #0008}.field{width:100%;padding:14px;border-radius:13px;background:#070707;border:1px solid #3b2022;color:#fff;margin:8px 0;font:inherit}.btn{display:block;width:100%;padding:15px;border-radius:13px;border:0;background:#c71924;color:#fff;font:inherit;font-weight:800;margin-top:9px;cursor:pointer;-webkit-appearance:none}.btn.secondary{background:#181214;border:1px solid #512026}.muted{color:#aa9193;font-size:13px;line-height:1.5}.hidden{display:none!important}.preview{display:none;width:100%;height:250px;object-fit:cover;border-radius:16px;background:#151515;margin:10px 0}.preview.has{display:block}.fileName{font-size:12px;color:#d5b9bb;margin-top:8px}.ok{color:#70d78b;font-size:13px;margin-top:8px}.err{color:#ff747c;font-size:13px;margin-top:8px}.picker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style></head><body><main><div class="brand">TAHA × SHAIMAA</div><h1>Date Admin ❤️</h1><p class="muted">Choose a photo first, preview it, then press Save Photo.</p><section class="card" id="loginBox"><b>Admin login</b><input class="field" id="pass" type="password" autocomplete="current-password" placeholder="Admin password"><button class="btn" id="loginBtn" type="button">Unlock Admin</button><div id="loginMsg"></div></section><div id="panel" class="hidden"><section class="card"><b>❤️ Taha & Shaimaa — Hero</b><p class="muted">Main photo at the top of the date website.</p><img id="heroPrev" class="preview" alt="Hero preview"><input class="picker" id="hero" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><button class="btn secondary" type="button" data-pick="hero">Choose Hero Photo</button><div class="fileName" id="heroName">No photo selected</div><button class="btn" type="button" data-upload="hero">Save Hero Photo</button><div id="heroMsg"></div></section><section class="card"><b>👶🏻 Amoura</b><p class="muted">Only shown inside the “نشوف عمورة” date option.</p><img id="amouraPrev" class="preview" alt="Amoura preview"><input class="picker" id="amoura" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><button class="btn secondary" type="button" data-pick="amoura">Choose Amoura Photo</button><div class="fileName" id="amouraName">No photo selected</div><button class="btn" type="button" data-upload="amoura">Save Amoura Photo</button><div id="amouraMsg"></div></section></div></main><script>const $=id=>document.getElementById(id);let token=sessionStorage.getItem('dateAdminToken')||'';async function parse(r){const text=await r.text();try{return JSON.parse(text)}catch{return{error:text||('HTTP '+r.status)}}}async function loginAdmin(){const msg=$('loginMsg');msg.className='muted';msg.textContent='Checking…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});const d=await parse(r);if(!r.ok)throw new Error(d.error||'Login failed');token=d.token;sessionStorage.setItem('dateAdminToken',token);showPanel()}catch(e){msg.className='err';msg.textContent=e.message}}function showPanel(){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');loadImages()}async function loadImages(){try{const r=await fetch('/api/images',{cache:'no-store'}),d=await parse(r);if(d.hero){$('heroPrev').src=d.hero+'?v='+Date.now();$('heroPrev').classList.add('has')}if(d.amoura){$('amouraPrev').src=d.amoura+'?v='+Date.now();$('amouraPrev').classList.add('has')}}catch(e){console.error(e)}}function choose(slot){$(slot).click()}function selected(slot){const file=$(slot).files&&$(slot).files[0];if(!file)return;$(slot+'Name').textContent=file.name;const prev=$(slot+'Prev');prev.src=URL.createObjectURL(file);prev.classList.add('has');$(slot+'Msg').textContent=''}async function uploadPhoto(slot){const input=$(slot),file=input.files&&input.files[0],msg=$(slot+'Msg');if(!file){msg.className='err';msg.textContent='Choose a photo first.';return}msg.className='muted';msg.textContent='Uploading…';const form=new FormData();form.append('image',file,file.name);try{const r=await fetch('/api/admin/upload/'+slot,{method:'POST',headers:{Authorization:'Bearer '+token},body:form});const d=await parse(r);if(r.status===401){sessionStorage.removeItem('dateAdminToken');throw new Error('Session expired. Refresh and login again.')}if(!r.ok)throw new Error(d.error||'Upload failed');msg.className='ok';msg.textContent='Saved successfully ✓';const prev=$(slot+'Prev');prev.src=d.url+'?v='+Date.now();prev.classList.add('has')}catch(e){msg.className='err';msg.textContent=e.message}}$('loginBtn').addEventListener('click',loginAdmin);$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')loginAdmin()});document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.pick)));document.querySelectorAll('[data-upload]').forEach(b=>b.addEventListener('click',()=>uploadPhoto(b.dataset.upload)));['hero','amoura'].forEach(s=>$(s).addEventListener('change',()=>selected(s)));if(token)showPanel();</script></body></html>
